# Railway service: worker
#
# Service settings → Config-as-code file path: railway/worker.toml
# Root Directory: /backend — the same image as the API, a different command.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
# Overrides the image's CMD: this process consumes a queue, it does not serve
# HTTP. The queue names live in app/worker.py so they cannot drift from the ones
# tasks are enqueued to.
#
# NOT `rq worker --url $REDIS_URL`. That builds its own Redis connection from a
# command line and takes no say in how it behaves, which is how this worker came
# to die seven times an hour: it sits blocked on a read for minutes, the network
# reclaims a connection nobody appears to be using, and RQ exits with
# "connection timeout, quitting" while Redis logs nothing at all. Starting from
# the module uses the same connection the API enqueues through — keepalives,
# health checks, retries — and it is also where error reporting is initialised
# and where the encryption keyring is checked before any job is taken.
startCommand = "python -m app.worker"

# Deliberately no healthcheckPath. A worker answers no HTTP at all, so a health
# check would fail forever and a platform that restarts unhealthy services
# would loop it — the same trap the Docker Compose file documents, where the
# worker inherited the API's HTTP healthcheck and reported unhealthy while
# working perfectly.

# No preDeployCommand either. Migrations belong to exactly one service, or two
# deploys race to apply the same revision.

# A worker that dies mid-job should come back: RQ's retries handle the job, but
# only if there is a process left to run them.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
