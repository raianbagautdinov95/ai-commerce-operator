# Railway service: api
#
# Service settings → Config-as-code file path: railway/api.toml
# Railway's config file is addressed from the repository root and does NOT
# follow the service's Root Directory, which is why the three services can keep
# separate files while api and worker share /backend as their root.
#
# Set Root Directory to /backend.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Rebuild only when the backend actually changes. Without this a frontend
# commit redeploys the API, which restarts it and drops in-flight webhooks for
# no reason.
watchPatterns = ["backend/**"]

[deploy]
# Left to the image. The Dockerfile reads $PORT, which Railway assigns per
# deployment; hardcoding a port here would put it back.
healthcheckPath = "/health/ready"
# Readiness touches the database and Redis, so allow for a cold Postgres.
healthcheckTimeout = 120

# Migrations run before the new version takes traffic, and a failure here stops
# the deploy — the old version keeps serving rather than a new one meeting a
# schema that was never applied.
#
# This runs inside THIS service's environment, which is the restricted aco_app
# role. Migrations create roles and grant privileges, so they need the owner:
# set MIGRATION_DATABASE_URL on this service to Railway's own DATABASE_URL and
# leave DATABASE_URL pointing at aco_app. migrations/env.py prefers the former.
preDeployCommand = "alembic -c alembic.ini upgrade head"

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
