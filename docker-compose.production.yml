# Serving this on a real domain, over HTTPS that renews itself.
#
#   PUBLIC_DOMAIN=app.example.com TLS_EMAIL=you@example.com \
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# One variable decides every public address. Five settings used to encode the
# same hostname independently — the CORS origins, two Shopify URIs, the Amazon
# redirect and the address baked into the frontend — and ops/TUNNEL.md exists
# because getting one of them out of step fails *silently*: Shopify keeps
# calling the address it was given, the store looks quiet, and nothing errors
# at either end. Derived from one value, they cannot disagree.
#
# Caddy is here for one reason: it obtains and renews a Let's Encrypt
# certificate on its own. Certificate expiry is a failure that arrives at 3am
# on a Sunday, ninety days after anybody last thought about it.
#
# Before this works, two things must be true outside this file:
#   * PUBLIC_DOMAIN resolves to this host (an A/AAAA record), and
#   * ports 80 and 443 reach it — 80 is not optional, it is how the
#     certificate is issued and renewed.
# And one thing inside Shopify: the Partner Dashboard's redirect URL must be
# the same string as SHOPIFY_REDIRECT_URI below, exactly.

# Every public address, derived once. Both the API and the worker get the whole
# set: overriding only the ones a service "obviously needs" is how the worker
# ended up registering webhooks against a hostname the API had already left.
x-public-addresses: &public-addresses
  CORS_ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN}
  SHOPIFY_REDIRECT_URI: https://${PUBLIC_DOMAIN}/api/integrations/shopify/callback
  SHOPIFY_WEBHOOK_URI: https://${PUBLIC_DOMAIN}/api/webhooks/shopify
  SP_API_REDIRECT_URI: https://${PUBLIC_DOMAIN}/api/integrations/amazon/callback
  WOOCOMMERCE_REDIRECT_URI: https://${PUBLIC_DOMAIN}/api/integrations/woocommerce/callback

services:
  proxy:
    image: caddy:2.8-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN, e.g. app.example.com}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL — Let'"'"'s Encrypt notifies it before a certificate expires}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data          # the certificates and account key: losing this
      - caddyconfig:/config      # means re-issuing, and Let's Encrypt rate-limits
    restart: unless-stopped

  api:
    environment:
      <<: *public-addresses
      APP_ENV: production
      AUTH_ENABLED: "true"
    # Reached through the proxy only. Publishing 8000 as well would leave a
    # plaintext way in beside the encrypted one.
    ports: !reset []

  worker:
    environment:
      <<: *public-addresses
      APP_ENV: production
      AUTH_ENABLED: "true"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time, so changing the domain means rebuilding this
        # image — not just restarting it.
        NEXT_PUBLIC_API_BASE: ${FRONTEND_API_BASE:-https://${PUBLIC_DOMAIN}}
        # Refuse to produce a production image pointing at localhost or a
        # throwaway tunnel. A shell variable left over from local work is
        # otherwise baked in silently and only surfaces as a browser that
        # cannot reach anything.
        REQUIRE_PUBLIC_API_BASE: "true"
    ports: !reset []

volumes:
  caddydata:
  caddyconfig:
